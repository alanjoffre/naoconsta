name: CI

# O CI roda só o que é DETERMINÍSTICO e não precisa de GPU, banco vetorial, LLM nem do corpus:
# lint, coleta e testes. O que depende do CUAD (26,8 MB de texto, fora do repo) pula por marcador
# declarado — e a trava de coleta garante que "pular" nunca vire "sumir".
#
# Este arquivo existe desde o commit nº 1 de propósito: no RodoQuery o CI nasceu na Fase 5 e
# ficou vermelho da Fase 6 até a 22, 32 execuções, porque ninguém leu o badge.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `[test]` e não `[dev]`: a suíte precisa dos extras que ela importa. Extra nomeado no
      # pyproject, não lista mágica aqui — foi essa lista mágica que quebrou o CI do RodoQuery.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint (ruff)
        run: ruff check .

      # Antes de rodar: se um teste não importar (extra faltando) ou sumir, falha AQUI, com a
      # causa explícita, em vez de um traceback no meio da suíte — ou, pior, um verde a menos.
      - name: Coleta completa (nenhum teste some em silêncio)
        run: python verificar_coleta.py

      - name: Testes
        run: pytest -q
